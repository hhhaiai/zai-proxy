name: Build and Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: zai-proxy

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            goarm: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            goarm: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: "7"

          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            goarm: ""
          - runner: ubuntu-latest
            goos: windows
            goarch: arm64
            goarm: ""

          - runner: ubuntu-latest
            goos: darwin
            goarch: amd64
            goarm: ""
          - runner: ubuntu-latest
            goos: darwin
            goarch: arm64
            goarm: ""

          - runner: ubuntu-latest
            goos: android
            goarch: amd64
            goarm: ""
          - runner: ubuntu-latest
            goos: android
            goarch: arm64
            goarm: ""
          - runner: ubuntu-latest
            goos: android
            goarch: arm
            goarm: "7"

          - runner: macos-latest
            goos: ios
            goarch: arm64
            goarm: ""
            ios_sdk: iphoneos
            ios_arch_flag: arm64
          - runner: macos-latest
            goos: ios
            goarch: amd64
            goarm: ""
            ios_sdk: iphonesimulator
            ios_arch_flag: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build binary
        id: build
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          OUTPUT_BASENAME="${APP_NAME}-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.goarch }}" == "arm" && -n "${{ matrix.goarm }}" ]]; then
            OUTPUT_BASENAME="${OUTPUT_BASENAME}v${{ matrix.goarm }}"
          fi

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BIN_FILE="${OUTPUT_BASENAME}.exe"
          else
            BIN_FILE="${OUTPUT_BASENAME}"
          fi

          mkdir -p dist

          if [[ "${{ matrix.goos }}" == "ios" ]]; then
            SDK=$(xcrun --sdk "${{ matrix.ios_sdk }}" --show-sdk-path)
            CC=$(xcrun --sdk "${{ matrix.ios_sdk }}" --find clang)

            GOOS=ios \
            GOARCH="${{ matrix.goarch }}" \
            CGO_ENABLED=1 \
            CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch ${{ matrix.ios_arch_flag }}" \
            CGO_LDFLAGS="-isysroot $SDK -arch ${{ matrix.ios_arch_flag }}" \
            go build -trimpath -ldflags="-s -w" -o "dist/${BIN_FILE}" .
          else
            if [[ -n "${{ matrix.goarm }}" ]]; then
              GOARM="${{ matrix.goarm }}" \
              GOOS="${{ matrix.goos }}" \
              GOARCH="${{ matrix.goarch }}" \
              CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "dist/${BIN_FILE}" .
            else
              GOOS="${{ matrix.goos }}" \
              GOARCH="${{ matrix.goarch }}" \
              CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "dist/${BIN_FILE}" .
            fi
          fi

          echo "bin_file=${BIN_FILE}" >> "$GITHUB_OUTPUT"
          echo "base_name=${OUTPUT_BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            ARCHIVE="${{ steps.build.outputs.base_name }}.zip"
            (
              cd dist
              zip -q "$ARCHIVE" "${{ steps.build.outputs.bin_file }}"
            )
          else
            ARCHIVE="${{ steps.build.outputs.base_name }}.tar.gz"
            tar -C dist -czf "dist/$ARCHIVE" "${{ steps.build.outputs.bin_file }}"
          fi

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.package.outputs.archive }}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$ARCHIVE" > "dist/$ARCHIVE.sha256"
          else
            shasum -a 256 "dist/$ARCHIVE" > "dist/$ARCHIVE.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256

  release:
    name: Create GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.txt

          if command -v sha256sum >/dev/null 2>&1; then
            for f in *.zip *.tar.gz; do
              [[ -f "$f" ]] || continue
              sha256sum "$f" >> checksums.txt
            done
          else
            for f in *.zip *.tar.gz; do
              [[ -f "$f" ]] || continue
              shasum -a 256 "$f" >> checksums.txt
            done
          fi

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
